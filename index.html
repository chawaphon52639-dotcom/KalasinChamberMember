<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ระบบฐานข้อมูลสมาชิก หอการค้าจังหวัดกาฬสินธุ์</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts Sarabun -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- React 18 & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase Compat SDKs (Prevents CORS/ESM Module Transpilation White Screen Error) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    body {
      font-family: 'Sarabun', sans-serif;
    }
    @media print {
      .print\:hidden { display: none !important; }
      body { background: white !important; }
      .break-inside-avoid { page-break-inside: avoid; break-inside: avoid; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
  <div id="root"></div>

  <!-- Main React Application Script -->
  <script type="text/babel">
    const firebaseConfig = {
      apiKey: "AIzaSyBrKnDDKxTAC9LguE1zWlBSTJoQAUXn3yM",
      authDomain: "my-rat-trap.firebaseapp.com",
      projectId: "my-rat-trap",
      storageBucket: "my-rat-trap.firebasestorage.app",
      messagingSenderId: "847693841799",
      appId: "1:847693841799:web:30a834dd41b128d97f7f22",
      measurementId: "G-JMGSF1S0F7"
    };

    // Safe Firebase Initialization
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    const KALASIN_DISTRICTS = [
      "เมืองกาฬสินธุ์", "กมลาไสย", "ยางตลาด", "ห้วยเม็ก", "สหัสขันธ์", 
      "สมเด็จ", "กุฉินารายณ์", "ท่าคันโท", "เขาวง", "ห้วยผึ้ง", 
      "คำม่วง", "หนองกุงศรี", "นามน", "ร่องคำ", "ดอนจาน", 
      "ฆ้องชัย", "สามชัย", "นาคู"
    ];

    const BUSINESS_TYPES = [
      "ผู้ประกอบการขนาดเล็ก",
      "SME",
      "อุตสาหกรรม",
      "วิสาหกิจชุมชน / การเกษตร",
      "บริการและท่องเที่ยว"
    ];

    const compressImage = (file, maxWidth = 500, quality = 0.75) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new window.Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = (err) => reject(err);
        };
        reader.onerror = (err) => reject(err);
      });
    };

    function App() {
      const [user, setUser] = React.useState(null);
      const [members, setMembers] = React.useState([]);
      const [loading, setLoading] = React.useState(true);
      const [customLogo, setCustomLogo] = React.useState(null);

      // Admin State & Dynamic Passcode
      const [isAdmin, setIsAdmin] = React.useState(false);
      const [isAdminModalOpen, setIsAdminModalOpen] = React.useState(false);
      const [adminPasscodeSecret, setAdminPasscodeSecret] = React.useState('1234');
      const [adminPasscode, setAdminPasscode] = React.useState('');
      const [adminError, setAdminError] = React.useState('');
      const [pendingAction, setPendingAction] = React.useState(null);

      // Change Password Modal State
      const [isChangePassModalOpen, setIsChangePassModalOpen] = React.useState(false);
      const [oldPass, setOldPass] = React.useState('');
      const [newPass, setNewPass] = React.useState('');
      const [confirmPass, setConfirmPass] = React.useState('');
      const [passChangeError, setPassChangeError] = React.useState('');

      // Custom Delete Confirm Modal State
      const [deleteTarget, setDeleteTarget] = React.useState(null);

      // Navigation & Filters
      const [activeTab, setActiveTab] = React.useState('members');
      const [searchQuery, setSearchQuery] = React.useState('');
      const [filterDistrict, setFilterDistrict] = React.useState('');
      const [filterType, setFilterType] = React.useState('');
      const [filterStatus, setFilterStatus] = React.useState('');
      const [filterPayment, setFilterPayment] = React.useState('');
      const [filterTcc, setFilterTcc] = React.useState('');
      const [filterGoodness, setFilterGoodness] = React.useState('');

      // Modals
      const [isFormOpen, setIsFormOpen] = React.useState(false);
      const [editingMember, setEditingMember] = React.useState(null);
      const [viewingMember, setViewingMember] = React.useState(null);
      const [isPrintModalOpen, setIsPrintModalOpen] = React.useState(false);
      const [printMode, setPrintMode] = React.useState('detail'); // 'detail' หรือ 'table'
      const [printTargetId, setPrintTargetId] = React.useState('ALL'); // 'ALL' หรือ ID สมาชิก
      const [toast, setToast] = React.useState(null);

      const showToast = (text, type = 'success') => {
        setToast({ text, type });
        setTimeout(() => setToast(null), 3500);
      };

      const executeAdminProtected = (action) => {
        if (isAdmin) {
          if (typeof action === 'function') action();
        } else {
          setPendingAction(() => action);
          setAdminPasscode('');
          setAdminError('');
          setIsAdminModalOpen(true);
        }
      };

      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (adminPasscode === adminPasscodeSecret) {
          setIsAdmin(true);
          setIsAdminModalOpen(false);
          showToast("เข้าสู่ระบบ Admin สำเร็จ");
          if (pendingAction) {
            pendingAction();
            setPendingAction(null);
          }
        } else {
          setAdminError('รหัสผ่าน Admin ไม่ถูกต้อง');
        }
      };

      const handleChangeAdminPasscode = async (e) => {
        e.preventDefault();
        if (oldPass !== adminPasscodeSecret) {
          setPassChangeError('รหัสผ่านเดิมไม่ถูกต้อง');
          return;
        }
        if (!newPass || newPass.trim().length < 4) {
          setPassChangeError('รหัสผ่านใหม่ต้องมีอย่างน้อย 4 ตัวอักษร');
          return;
        }
        if (newPass !== confirmPass) {
          setPassChangeError('รหัสผ่านใหม่และการยืนยันไม่ตรงกัน');
          return;
        }

        try {
          await db.collection('chamber_settings').doc('admin_config').set({
            passcode: newPass.trim(),
            updatedAt: new Date().toISOString()
          });
          showToast("เปลี่ยนรหัสผ่าน Admin เรียบร้อยแล้ว");
          setIsChangePassModalOpen(false);
          setOldPass('');
          setNewPass('');
          setConfirmPass('');
          setPassChangeError('');
        } catch (err) {
          console.error("Change pass error:", err);
          showToast("ไม่สามารถบันทึกรหัสผ่านใหม่ได้", "error");
        }
      };

      React.useEffect(() => {
        auth.signInAnonymously().catch(console.error);
        return auth.onAuthStateChanged(setUser);
      }, []);

      React.useEffect(() => {
        if (!user) return;

        // ดึงรหัสผ่าน Admin จาก Cloud Firestore
        const unsubConfig = db.collection('chamber_settings').doc('admin_config')
          .onSnapshot((docSnap) => {
            if (docSnap.exists && docSnap.data().passcode) {
              setAdminPasscodeSecret(docSnap.data().passcode);
            }
          }, (err) => console.error("Error reading admin config:", err));

        // ดึงโลโก้หอการค้าถาวรจาก Cloud Firestore
        const unsubLogo = db.collection('chamber_settings').doc('app_logo')
          .onSnapshot((docSnap) => {
            if (docSnap.exists && docSnap.data().logo) {
              setCustomLogo(docSnap.data().logo);
            }
          }, (err) => console.error("Error reading logo:", err));

        // ดึงข้อมูลสมาชิกแบบ Real-time
        const unsubMembers = db.collection('chamber_members')
          .onSnapshot((snapshot) => {
            const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            setMembers(data);
            setLoading(false);
          }, (err) => {
            console.error(err);
            showToast("ไม่สามารถดึงข้อมูลได้ กรุณาตรวจ Firestore Rules", "error");
            setLoading(false);
          });

        return () => {
          unsubConfig();
          unsubLogo();
          unsubMembers();
        };
      }, [user]);

      const handleLogoChange = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        executeAdminProtected(async () => {
          try {
            showToast("กำลังบันทึกโลโก้ลง Cloud...");
            const b64 = await compressImage(file, 250, 0.85);
            await db.collection('chamber_settings').doc('app_logo').set({
              logo: b64,
              updatedAt: new Date().toISOString()
            }, { merge: true });
            showToast("บันทึกโลโก้หอการค้าถาวรเรียบร้อยแล้ว");
          } catch (err) {
            console.error("Logo upload error:", err);
            showToast("ไม่สามารถบันทึกโลโก้ลง Cloud ได้", "error");
          }
        });
      };

      const emptyForm = {
        name: '', businessName: '', businessType: 'SME',
        address: '', district: 'เมืองกาฬสินธุ์', phone: '', lineId: '',
        status: 'เป็นสมาชิก', paymentStatus: 'ชำระค่าสมาชิกแล้ว',
        tccConnect: 'NO', goodnessSign: 'ไม่ได้รับ',
        googleMapUrl: '', entrepreneurPhoto: '', businessPhoto: ''
      };

      const [formData, setFormData] = React.useState(emptyForm);

      const handleSave = async (e) => {
        e.preventDefault();
        if (!formData.name.trim() || !formData.businessName.trim()) {
          showToast("กรุณากรอกชื่อและชื่อกิจการ", "error");
          return;
        }

        try {
          const payload = { ...formData, updatedAt: new Date().toISOString() };
          if (editingMember) {
            await db.collection('chamber_members').doc(editingMember.id).update(payload);
            showToast("อัปเดตข้อมูลสำเร็จ");
          } else {
            payload.createdAt = new Date().toISOString();
            await db.collection('chamber_members').add(payload);
            showToast("เพิ่มสมาชิกใหม่สำเร็จ");
          }
          setIsFormOpen(false);
        } catch (err) {
          console.error(err);
          showToast("เกิดข้อผิดพลาดในการบันทึก", "error");
        }
      };

      const confirmDelete = (member) => {
        executeAdminProtected(() => {
          setDeleteTarget(member);
        });
      };

      const handleConfirmDeleteExecute = async () => {
        if (!deleteTarget) return;
        try {
          await db.collection('chamber_members').doc(deleteTarget.id).delete();
          showToast("ลบข้อมูลสำเร็จ");
          setDeleteTarget(null);
        } catch (err) {
          showToast("ลบข้อมูลไม่สำเร็จ", "error");
          setDeleteTarget(null);
        }
      };

      const filtered = React.useMemo(() => {
        return members.filter(m => {
          const q = searchQuery.toLowerCase();
          const matchSearch = !q || (m.name && m.name.toLowerCase().includes(q)) || (m.businessName && m.businessName.toLowerCase().includes(q)) || (m.phone && m.phone.includes(q)) || (m.lineId && m.lineId.toLowerCase().includes(q));
          const matchD = !filterDistrict || m.district === filterDistrict;
          const matchT = !filterType || m.businessType === filterType;
          const matchS = !filterStatus || m.status === filterStatus;
          const matchP = !filterPayment || m.paymentStatus === filterPayment;
          const matchTcc = !filterTcc || m.tccConnect === filterTcc;
          const matchG = !filterGoodness || m.goodnessSign === filterGoodness;
          return matchSearch && matchD && matchT && matchS && matchP && matchTcc && matchG;
        });
      }, [members, searchQuery, filterDistrict, filterType, filterStatus, filterPayment, filterTcc, filterGoodness]);

      // ดึงรายการสมาชิกสำหรับพิมพ์ (ทั้งกลุ่ม หรือ รายบุคคล)
      const membersToPrint = React.useMemo(() => {
        if (printTargetId === 'ALL') return filtered;
        const target = members.find(m => m.id === printTargetId);
        return target ? [target] : filtered;
      }, [printTargetId, filtered, members]);

      const stats = React.useMemo(() => {
        return {
          total: members.length,
          active: members.filter(m => m.status === 'เป็นสมาชิก').length,
          paid: members.filter(m => m.paymentStatus === 'ชำระค่าสมาชิกแล้ว').length,
          tcc: members.filter(m => m.tccConnect === 'YES').length,
          goodness: members.filter(m => m.goodnessSign === 'ได้รับ').length
        };
      }, [members]);

      const exportCSV = () => {
        if (filtered.length === 0) return showToast("ไม่มีข้อมูลให้ส่งออก", "warning");
        const headers = ["ลำดับ", "ชื่อ-นามสกุล", "ชื่อกิจการ", "ประเภท", "อำเภอ", "เบอร์โทร", "LINE ID", "สถานะ", "การชำระเงิน", "TCC Connect", "ป้ายของดี", "Google Maps"];
        const rows = filtered.map((m, i) => [
          i + 1, `"${m.name || ''}"`, `"${m.businessName || ''}"`, `"${m.businessType || ''}"`, `"${m.district || ''}"`, `"${m.phone || ''}"`, `"${m.lineId || ''}"`, `"${m.status || ''}"`, `"${m.paymentStatus || ''}"`, `"${m.tccConnect || ''}"`, `"${m.goodnessSign || ''}"`, `"${m.googleMapUrl || ''}"`
        ]);
        const csv = "\uFEFF" + [headers.join(","), ...rows.map(r => r.join(","))].join("\n");
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `สมาชิกหอการค้ากาฬสินธุ์_${new Date().toISOString().slice(0,10)}.csv`;
        link.click();
        showToast("ส่งออกไฟล์ CSV เรียบร้อยแล้ว");
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* Toast Notification */}
          {toast && (
            <div className={`fixed top-4 right-4 z-50 px-4 py-2.5 rounded-lg text-white font-medium shadow-xl text-sm ${toast.type === 'error' ? 'bg-rose-600' : toast.type === 'warning' ? 'bg-amber-500' : 'bg-emerald-600'}`}>
              {toast.text}
            </div>
          )}

          {/* Header */}
          <header className="bg-gradient-to-r from-blue-950 via-blue-900 to-indigo-950 text-white shadow-lg border-b-4 border-amber-500 sticky top-0 z-30 print:hidden">
            <div className="max-w-7xl mx-auto px-4 py-3">
              <div className="flex flex-col md:flex-row items-center justify-between gap-4">
                
                <div className="flex items-center gap-3 w-full md:w-auto">
                  <label htmlFor="logo-up" className="cursor-pointer shrink-0" title="คลิกเพื่อเปลี่ยนโลโก้">
                    {customLogo ? (
                      <img src={customLogo} className="w-12 h-12 object-contain rounded-full bg-white p-1 border-2 border-amber-400" />
                    ) : (
                      <div className="w-12 h-12 rounded-full bg-gradient-to-br from-amber-400 to-amber-600 text-blue-950 font-black flex items-center justify-center border-2 border-white shadow">
                        TCC
                      </div>
                    )}
                  </label>
                  <input id="logo-up" type="file" accept="image/*" className="hidden" onChange={handleLogoChange} />

                  <div>
                    <h1 className="text-lg md:text-xl font-bold text-white leading-tight">
                      ระบบฐานข้อมูลสมาชิก หอการค้าจังหวัดกาฬสินธุ์
                    </h1>
                    <div className="flex items-center gap-2 mt-0.5 flex-wrap">
                      <span className="text-[11px] text-blue-200">Kalasin Chamber of Commerce</span>
                      <span className="text-[10px] bg-blue-800 border border-amber-400/50 px-2 py-0.2 rounded text-amber-300 font-medium">
                        ✨ พัฒนาระบบโดย น้าราม [เลขาธิการหอการค้าจังหวัดกาฬสินธุ์]
                      </span>
                    </div>
                  </div>
                </div>

                <div className="flex items-center gap-2 flex-wrap justify-end w-full md:w-auto">
                  {isAdmin ? (
                    <div className="bg-emerald-900/90 border border-emerald-400 text-emerald-200 text-xs px-2.5 py-1.5 rounded-lg flex items-center gap-2 font-semibold">
                      <span>🔑 โหมด Admin</span>
                      <button onClick={() => { setOldPass(''); setNewPass(''); setConfirmPass(''); setPassChangeError(''); setIsChangePassModalOpen(true); }} className="bg-amber-400 hover:bg-amber-300 text-blue-950 px-2 py-0.5 rounded text-[10px] font-bold">
                        ⚙️ ตั้งรหัสใหม่
                      </button>
                      <button onClick={() => { setIsAdmin(false); showToast("ออกจากโหมด Admin", "warning"); }} className="bg-emerald-700 hover:bg-emerald-600 text-white px-1.5 py-0.5 rounded text-[10px]">
                        ออก
                      </button>
                    </div>
                  ) : (
                    <button onClick={() => executeAdminProtected(() => {})} className="bg-blue-900 hover:bg-blue-800 text-blue-200 text-xs px-3 py-2 rounded-lg border border-blue-700">
                      🔒 เข้าสู่ระบบ Admin
                    </button>
                  )}

                  <button onClick={() => executeAdminProtected(() => { setEditingMember(null); setFormData(emptyForm); setIsFormOpen(true); })} className="bg-amber-500 hover:bg-amber-400 text-blue-950 font-bold px-3.5 py-2 rounded-lg text-xs shadow">
                    + เพิ่มสมาชิกใหม่
                  </button>
                  <button onClick={exportCSV} className="bg-blue-800 hover:bg-blue-700 text-white px-3 py-2 rounded-lg text-xs border border-blue-600">
                    📥 CSV (Excel)
                  </button>
                  <button onClick={() => setIsPrintModalOpen(true)} className="bg-blue-800 hover:bg-blue-700 text-white px-3 py-2 rounded-lg text-xs border border-blue-600">
                    🖨️ พิมพ์ / PDF
                  </button>
                </div>

              </div>

              {/* Tabs */}
              <div className="flex gap-2 mt-3 pt-2 border-t border-blue-800/60 text-xs">
                <button onClick={() => setActiveTab('members')} className={`px-3 py-1.5 rounded-md font-semibold ${activeTab === 'members' ? 'bg-white text-blue-950 shadow' : 'text-blue-200 hover:bg-blue-800'}`}>
                  รายชื่อสมาชิก ({filtered.length})
                </button>
                <button onClick={() => setActiveTab('dashboard')} className={`px-3 py-1.5 rounded-md font-semibold ${activeTab === 'dashboard' ? 'bg-white text-blue-950 shadow' : 'text-blue-200 hover:bg-blue-800'}`}>
                  สถิติภาพรวม
                </button>
              </div>
            </div>
          </header>

          {}
          <main className="max-w-7xl mx-auto px-4 py-6 flex-1 w-full">
            {loading ? (
              <div className="text-center py-20 text-slate-500 font-medium">กำลังโหลดข้อมูลจาก Cloud Firebase...</div>
            ) : activeTab === 'dashboard' ? (
              <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
                <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm"><span className="text-xs text-slate-400">สมาชิกทั้งหมด</span><div className="text-2xl font-bold text-blue-950 mt-1">{stats.total}</div></div>
                <div className="bg-white p-4 rounded-xl border border-emerald-200 bg-emerald-50/40 shadow-sm"><span className="text-xs text-emerald-700">สมาชิกปัจจุบัน</span><div className="text-2xl font-bold text-emerald-700 mt-1">{stats.active}</div></div>
                <div className="bg-white p-4 rounded-xl border border-blue-200 bg-blue-50/40 shadow-sm"><span className="text-xs text-blue-700">ชำระค่าสมาชิกแล้ว</span><div className="text-2xl font-bold text-blue-700 mt-1">{stats.paid}</div></div>
                <div className="bg-white p-4 rounded-xl border border-indigo-200 bg-indigo-50/40 shadow-sm"><span className="text-xs text-indigo-700">TCC Connect</span><div className="text-2xl font-bold text-indigo-700 mt-1">{stats.tcc}</div></div>
                <div className="bg-white p-4 rounded-xl border border-amber-200 bg-amber-50/40 shadow-sm"><span className="text-xs text-amber-700">ป้ายของดี</span><div className="text-2xl font-bold text-amber-700 mt-1">{stats.goodness}</div></div>
              </div>
            ) : (
              <div className="space-y-4">
                {/* Search & Filters */}
                <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-3">
                  <div className="flex flex-col sm:flex-row gap-3">
                    <input type="text" placeholder="🔍 ค้นหาชื่อผู้ประกอบการ, ร้านค้า, เบอร์โทร, ID LINE..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-800" />

                        className={`px-3 py-1 rounded font-semibold transition-all ${printMode === 'detail' ? 'bg-blue-950 text-white shadow' : 'text-slate-700 hover:bg-slate-300'}`}
                      >
                        🖼️ ข้อมูลสมบูรณ์ + รูปภาพ
                      </button>
                      <button 
                        onClick={() => setPrintMode('table')} 
                        className={`px-3 py-1 rounded font-semibold transition-all ${printMode === 'table' ? 'bg-blue-950 text-white shadow' : 'text-slate-700 hover:bg-slate-300'}`}
                      >
                        📊 ตารางสรุป
                      </button>
                    </div>
                  </div>
                  <div className="flex gap-2">
                    <button onClick={() => window.print()} className="bg-blue-950 text-white px-4 py-1.5 rounded text-xs font-bold hover:bg-blue-900 shadow">🖨️ สั่งพิมพ์ / บันทึก PDF</button>
                    <button onClick={() => setIsPrintModalOpen(false)} className="px-3 py-1.5 border rounded text-xs hover:bg-slate-200">ปิด</button>
                  </div>
                </div>

                <div className="p-8 overflow-y-auto flex-1 print:p-0">
                  <div className="text-center border-b-2 border-blue-950 pb-4 mb-6">
                    <div className="flex items-center justify-center gap-3 mb-1">
                      {customLogo && <img src={customLogo} className="w-12 h-12 object-contain" />}
                      <h2 className="text-2xl font-bold text-blue-950">หอการค้าจังหวัดกาฬสินธุ์</h2>
                    </div>
                    <h3 className="text-sm font-bold text-slate-800">
                      {printTargetId === 'ALL' ? 'รายงานข้อมูลสมาชิกและสถานะการต่ออายุ (ฉบับสมบูรณ์)' : 'หนังสือรับรองและข้อมูลสมาชิกรายบุคคล'}
                    </h3>
                    <p className="text-[11px] text-slate-500 mt-1">วันที่พิมพ์: {new Date().toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' })}</p>
                  </div>

                  {printMode === 'detail' ? (
                    /* Detailed Printable View with Photos */
                    <div className="space-y-4">
                      {membersToPrint.map((m, i) => (
                        <div key={m.id} className="border border-slate-300 rounded-lg p-3.5 bg-white space-y-2 text-xs break-inside-avoid print:break-inside-avoid shadow-sm">
                          <div className="flex justify-between items-center bg-gradient-to-r from-blue-950 to-indigo-900 text-white px-3 py-1.5 rounded font-bold">
                            <span>#{i + 1} {m.name} - {m.businessName}</span>
                            <span className="text-amber-300">อ.{m.district} ({m.businessType})</span>
                          </div>
                          
                          <div className="grid grid-cols-1 md:grid-cols-3 gap-3 pt-1">
                            {/* Photos */}
                            <div className="flex gap-2 justify-center items-center bg-slate-50 p-2 border border-slate-200 rounded">
                              <div className="text-center">
                                <span className="block text-[10px] text-slate-500 mb-1 font-semibold">ผู้ประกอบการ</span>
                                <div className="w-20 h-20 bg-slate-200 rounded border overflow-hidden flex items-center justify-center mx-auto">
                                  {m.entrepreneurPhoto ? <img src={m.entrepreneurPhoto} className="w-full h-full object-cover" /> : <span className="text-2xl">👤</span>}
                                </div>
                              </div>
                              <div className="text-center">
                                <span className="block text-[10px] text-slate-500 mb-1 font-semibold">สถานประกอบการ</span>
                                <div className="w-20 h-20 bg-slate-200 rounded border overflow-hidden flex items-center justify-center mx-auto">
                                  {m.businessPhoto ? <img src={m.businessPhoto} className="w-full h-full object-cover" /> : <span className="text-2xl">🏢</span>}
                                </div>
                              </div>
                            </div>

                            {/* Details 1 */}
                            <div className="space-y-1.5 bg-slate-50 p-2.5 border border-slate-200 rounded">
                              <div><strong className="text-slate-700">ที่อยู่:</strong> {m.address || '-'}</div>
                              <div><strong className="text-slate-700">เบอร์โทรศัพท์:</strong> {m.phone || '-'}</div>
                              <div><strong className="text-slate-700">LINE ID:</strong> {m.lineId || '-'}</div>
                              {m.googleMapUrl && <div className="truncate"><strong className="text-slate-700">GPS Maps:</strong> <span className="text-blue-800 underline font-mono text-[10px]">{m.googleMapUrl}</span></div>}
                            </div>

                            {/* Details 2 */}
                            <div className="space-y-1.5 bg-slate-50 p-2.5 border border-slate-200 rounded">
                              <div><strong className="text-slate-700">สถานะสมาชิก:</strong> <span className={m.status === 'เป็นสมาชิก' ? 'text-emerald-700 font-bold' : 'text-rose-700 font-bold'}>{m.status}</span></div>
                              <div><strong className="text-slate-700">การชำระเงิน:</strong> <span className="text-blue-800 font-bold">{m.paymentStatus}</span></div>
                              <div><strong className="text-slate-700">TCC Connect:</strong> <span className="font-bold text-indigo-700">{m.tccConnect}</span></div>
                              <div><strong className="text-slate-700">ป้ายของดีหอการค้า:</strong> <span className="font-bold text-amber-700">{m.goodnessSign}</span></div>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  ) : (
                    /* Summary Table View */
                    <table className="w-full text-left text-xs border border-slate-300">
                      <thead>
                        <tr className="bg-blue-950 text-white">
                          <th className="p-2 border">#</th><th className="p-2 border">ชื่อ-นามสกุล</th><th className="p-2 border">ชื่อกิจการ</th><th className="p-2 border">อำเภอ</th><th className="p-2 border">เบอร์ติดต่อ</th><th className="p-2 border">สถานะ</th><th className="p-2 border">ชำระเงิน</th><th className="p-2 border">TCC</th>
                        </tr>
                      </thead>
                      <tbody>
                        {membersToPrint.map((m, i) => (
                          <tr key={m.id} className={i % 2 === 0 ? 'bg-white' : 'bg-slate-50'}>
                            <td className="p-2 border text-center">{i + 1}</td>
                            <td className="p-2 border font-bold">{m.name}</td>
                            <td className="p-2 border">{m.businessName}</td>
                            <td className="p-2 border font-bold">{m.district}</td>
                            <td className="p-2 border">{m.phone || '-'}</td>
                            <td className="p-2 border text-center">{m.status}</td>
                            <td className="p-2 border text-center">{m.paymentStatus}</td>
                            <td className="p-2 border text-center font-bold">{m.tccConnect}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  )}

                  <div className="mt-8 pt-4 flex justify-between items-end text-xs text-slate-500 break-inside-avoid print:break-inside-avoid">
                    <div>
                      <p className="font-bold text-slate-800">หอการค้าจังหวัดกาฬสินธุ์</p>
                      <p>Kalasin Chamber of Commerce</p>
                    </div>
                    <div className="text-right">
                      <p>ลงชื่อ..........................................................</p>
                      <p className="mt-1 font-bold text-slate-800">( น้าราม )</p>
                      <p>เลขาธิการหอการค้าจังหวัดกาฬสินธุ์</p>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="bg-blue-950 text-blue-300 text-xs py-3 border-t border-blue-900 print:hidden">
            <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-2">
              <span>&copy; {new Date().getFullYear()} ระบบบริหารจัดการสมาชิก หอการค้าจังหวัดกาฬสินธุ์</span>
              <span className="text-amber-400 font-medium">พัฒนาระบบโดย น้าราม [เลขาธิการหอการค้าจังหวัดกาฬสินธุ์]</span>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
